<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Typing Speed Test</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">⌨️ TypeFast</div>
            <div class="best-score">
                Best: <span id="bestScore">0</span> WPM
            </div>
        </header>

        <main>

            <section class="hero">
                <h1>Typing Speed Test</h1>
                <p>Test your typing speed and accuracy.</p>
            </section>

            <div class="stats">

                <div class="stat-box">
                    <span class="stat-label">Time</span>
                    <strong id="timer">30</strong>
                    <small>seconds</small>
                </div>

                <div class="stat-box">
                    <span class="stat-label">WPM</span>
                    <strong id="wpm">0</strong>
                    <small>words/min</small>
                </div>

                <div class="stat-box">
                    <span class="stat-label">Accuracy</span>
                    <strong id="accuracy">100%</strong>
                    <small>accuracy</small>
                </div>

            </div>

            <div class="test-card">

                <div class="test-top">
                    <span id="status">Ready to type...</span>

                    <select id="timeSelect">
                        <option value="30">30 Seconds</option>
                        <option value="60">60 Seconds</option>
                        <option value="120">2 Minutes</option>
                    </select>
                </div>

                <div id="textDisplay" class="text-display"></div>

                <textarea
                    id="typingInput"
                    placeholder="Start typing here..."
                    spellcheck="false"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                ></textarea>

                <div class="progress">
                    <div id="progressBar"></div>
                </div>

                <button id="restartBtn" class="restart-btn">
                    ↻ Restart Test
                </button>

            </div>

            <div id="resultCard" class="result-card hidden">

                <div class="result-icon">🎉</div>

                <h2>Test Complete!</h2>

                <div class="result-grid">

                    <div>
                        <span>WPM</span>
                        <strong id="finalWpm">0</strong>
                    </div>

                    <div>
                        <span>Accuracy</span>
                        <strong id="finalAccuracy">0%</strong>
                    </div>

                    <div>
                        <span>Characters</span>
                        <strong id="finalCharacters">0</strong>
                    </div>

                </div>

                <button id="tryAgainBtn" class="try-btn">
                    Try Again
                </button>

            </div>

        </main>

        <footer>
            <p>TypeFast 🚀 By Amit Yadav </p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
